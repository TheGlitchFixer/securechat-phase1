name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o pingzy-source.zip -d src
          cp -a src/. .
          rm -rf src pingzy-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable AndroidX
        run: |
          if [ -f gradle.properties ]; then
            grep -q "^android.useAndroidX=" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          else
            echo "android.useAndroidX=true" > gradle.properties
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PserverUrl="wss://pingzy-server-production.up.railway.app"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pingzy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
